[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pfm-slv"
version = "0.1.0"
description = "Relative Entropy vs Stochastic Local Volatility"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src/Stochastic_Local_Volatility"]
